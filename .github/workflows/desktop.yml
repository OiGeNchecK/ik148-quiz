# Builds native desktop installers on GitHub-hosted runners:
#   - Windows: NSIS installer (.exe), x64
#   - macOS:   DMG, universal (Intel + Apple Silicon)
#
# Triggers:
#   - pushing a tag like v1.1.0
#   - manual run (workflow_dispatch)
# Either way, installers are attached to a GitHub Release named after
# the version in package.json (v<version>), created if it doesn't exist.
name: Desktop builds

on:
  push:
    branches: [main]
    # a version bump in package.json (or editing this file) triggers a build;
    # the release is keyed to v<version>
    paths:
      - "package.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # no code-signing certificates — build unsigned
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build installer
        run: npx electron-builder --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: Deutsch B1 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          files: installers/*
