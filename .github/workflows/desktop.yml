# Builds native desktop installers on GitHub-hosted runners:
#   - Windows: NSIS installer (.exe), x64
#   - macOS:   DMG, universal (Intel + Apple Silicon)
#
# Triggers:
#   - pushing a tag like v1.1.0  → builds AND attaches installers to a GitHub Release
#   - manual run (workflow_dispatch) → builds and stores installers as workflow artifacts
name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # no code-signing certificates — build unsigned
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Build installer
        run: npx electron-builder --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.dmg
