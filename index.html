<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IK 148 – Lektion 2 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #e8c46a;
    --accent2: #c0392b;
    --text: #f0ece2;
    --muted: #8a8a9a;
    --correct: #27ae60;
    --wrong: #c0392b;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  /* fingerprint bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 50%, #0d1b3e 0%, #1a1a2e 100%);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 18px, rgba(232,196,106,0.03) 19px, transparent 20px);
    z-index: -1;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.6s ease both;
  }

  .badge {
    display: inline-block;
    background: var(--accent2);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 6vw, 52px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(232,196,106,0.3);
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }

  /* score bar */
  .score-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--muted);
    animation: fadeDown 0.6s 0.1s ease both;
  }
  .progress-track {
    flex: 1;
    max-width: 300px;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .score-num { color: var(--accent); font-weight: 600; }

  /* category label */
  .category {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }

  /* card */
  .card {
    background: var(--card);
    border: 1px solid rgba(232,196,106,0.12);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    animation: slideUp 0.4s ease both;
  }

  .question-num {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .question-text {
    font-size: clamp(16px, 3vw, 20px);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 24px;
    color: var(--text);
  }

  .question-text em {
    color: var(--accent);
    font-style: normal;
    font-weight: 700;
  }

  /* options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    transition: all 0.2s ease;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(232,196,106,0.06);
    transform: translateX(4px);
  }

  .option .letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(39,174,96,0.12);
  }
  .option.correct .letter { background: var(--correct); color: #fff; }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(192,57,43,0.12);
  }
  .option.wrong .letter { background: var(--wrong); color: #fff; }

  .option:disabled { cursor: default; }

  /* feedback */
  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; animation: fadeUp 0.3s ease; }
  .feedback.ok { background: rgba(39,174,96,0.12); border: 1px solid rgba(39,174,96,0.3); color: #7dcea0; }
  .feedback.nope { background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.3); color: #f1948a; }

  /* next btn */
  .btn-next {
    margin-top: 20px;
    padding: 14px 32px;
    background: var(--accent);
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(232,196,106,0.3);
  }
  .btn-next.show { display: inline-block; animation: fadeUp 0.3s ease; }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,196,106,0.4); }

  /* result */
  #result {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 20px;
    width: 100%;
    max-width: 640px;
    animation: slideUp 0.5s ease both;
  }

  .result-emoji { font-size: 64px; }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    color: var(--accent);
  }

  .result-score {
    font-size: 72px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .result-sub { color: var(--muted); font-size: 15px; }

  .btn-restart {
    padding: 14px 36px;
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .btn-restart:hover { transform: scale(1.04); }

  /* breakdown */
  .breakdown {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(232,196,106,0.1);
    border-radius: var(--radius);
    padding: 24px;
  }
  .breakdown h3 { color: var(--accent); margin-bottom: 16px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
    color: var(--muted);
  }
  .breakdown-item:last-child { border-bottom: none; }
  .breakdown-item span:last-child { color: var(--accent); font-weight: 700; }

  @keyframes fadeDown { from { opacity:0; transform: translateY(-12px); } to { opacity:1; transform: none; } }
  @keyframes slideUp  { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform: none; } }
  @keyframes fadeUp   { from { opacity:0; transform: translateY(6px); }  to { opacity:1; transform: none; } }
</style>
</head>
<body>

<header>
  <div class="badge">IK 148 · B1</div>
  <h1>Lektion 2 Quiz</h1>
  <p class="subtitle">Kriminalität · Grammatik · Kommunikation</p>
</header>

<div class="score-bar">
  <span id="q-counter">Frage 1 von 15</span>
  <div class="progress-track"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <span class="score-num" id="score-display">0 ✓</span>
</div>

<div class="card" id="quiz-card">
  <div class="category" id="q-category"></div>
  <div class="question-num" id="q-num"></div>
  <div class="question-text" id="q-text"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="btn-next" id="btn-next" onclick="nextQ()">Weiter →</button>
</div>

<div id="result">
  <div class="result-emoji" id="res-emoji"></div>
  <div class="result-title" id="res-title"></div>
  <div class="result-score" id="res-score"></div>
  <div class="result-sub" id="res-sub"></div>
  <div class="breakdown" id="breakdown"></div>
  <button class="btn-restart" onclick="restart()">Nochmal versuchen 🔄</button>
</div>

<script>
const questions = [
  // ── GRAMMATIK: wegen + Genitiv ──
  {
    cat: "Grammatik: wegen + Genitiv",
    q: "Ergänzen Sie: Er ruft an wegen ___ Termins.",
    opts: ["des", "dem", "den", "der"],
    ans: 0,
    exp: "Maskulinum/Neutrum Genitiv → <strong>des</strong> Termins ✔"
  },
  {
    cat: "Grammatik: wegen + Genitiv",
    q: "Wählen Sie die richtige Form: Ich rufe an wegen ___ Wohnung.",
    opts: ["des", "der", "dem", "einen"],
    ans: 1,
    exp: "Femininum Genitiv → <strong>der</strong> Wohnung ✔"
  },
  {
    cat: "Grammatik: wegen + Genitiv",
    q: "Ergänzen Sie: wegen ___ gebrauchten Fahrrads",
    opts: ["des", "der", "einem", "dem"],
    ans: 0,
    exp: "Neutrum Genitiv → <strong>des</strong> Fahrrads. Das Adjektiv bekommt -en."
  },
  {
    cat: "Grammatik: wegen + Genitiv",
    q: "<em>wegen</em> oder <em>weil</em>? — ___ des Regens fällt das Spiel aus.",
    opts: ["weil", "wegen", "da", "denn"],
    ans: 1,
    exp: "<strong>wegen</strong> + Genitiv (nur ein Nomen, kein Verb!)"
  },
  {
    cat: "Grammatik: wegen + Genitiv",
    q: "<em>wegen</em> oder <em>weil</em>? — Er kommt nicht, ___ er krank ist.",
    opts: ["wegen", "weil", "denn", "da"],
    ans: 1,
    exp: "<strong>weil</strong> → ganzer Nebensatz, Verb am Ende ✔"
  },

  // ── GRAMMATIK: Infinitiv mit zu ──
  {
    cat: "Grammatik: Infinitiv mit zu",
    q: "Ergänzen Sie: Es ist wichtig, sofort die Polizei ___ ___.",
    opts: ["zu informieren", "informieren", "informiert", "zu informiert"],
    ans: 0,
    exp: "Es ist + Adjektiv → <strong>zu + Infinitiv</strong> am Ende ✔"
  },
  {
    cat: "Grammatik: Infinitiv mit zu",
    q: "Trennbares Verb: Vergiss nicht, das Licht ___!",
    opts: ["auszumachen", "zu ausmachen", "ausmachen", "gemacht"],
    ans: 0,
    exp: "Bei trennbaren Verben: Präfix + <strong>zu</strong> + Stamm → <strong>auszu|machen</strong>"
  },
  {
    cat: "Grammatik: Infinitiv mit zu",
    q: "Welcher Satz ist RICHTIG?",
    opts: [
      "Ich versuche Deutsch lernen.",
      "Ich versuche, Deutsch zu lernen.",
      "Ich versuche, zu Deutsch lernen.",
      "Ich versuche Deutsch zu lernen."
    ],
    ans: 1,
    exp: "Nach Verben wie <em>versuchen, planen, beginnen</em>: Komma + <strong>zu + Infinitiv</strong>"
  },
  {
    cat: "Grammatik: Infinitiv mit zu",
    q: "Was ist korrekt? Denkt daran, eure Sachen ___!",
    opts: ["mitzunehmen", "zu mitnehmen", "mitnehmen", "genommen"],
    ans: 0,
    exp: "<em>mitnehmen</em> ist trennbar → <strong>mit|zu|nehmen</strong> ✔"
  },
  {
    cat: "Grammatik: Infinitiv mit zu",
    q: "Welches Verb braucht KEIN <em>zu</em>?",
    opts: ["versuchen", "müssen", "beginnen", "vergessen"],
    ans: 1,
    exp: "Modalverben (<em>müssen, können, wollen…</em>) brauchen kein <em>zu</em>!"
  },

  // ── WÖRTER & KOMMUNIKATION ──
  {
    cat: "Wörter: Kriminalität",
    q: "Was bedeutet <em>verdächtig</em>?",
    opts: ["verdient", "bekannt", "suspect/suspicious", "gefährlich"],
    ans: 2,
    exp: "<strong>verdächtig</strong> = suspect, under suspicion — jemand, den die Polizei beobachtet"
  },
  {
    cat: "Wörter: Kriminalität",
    q: "Der Einbrecher konnte durch ein offenes Fenster ___.",
    opts: ["fliehen", "bleiben", "schlafen", "ankommen"],
    ans: 0,
    exp: "<strong>fliehen</strong> = to flee/escape. Perfekt: ist geflohen."
  },
  {
    cat: "Kommunikation: Vorschläge",
    q: "Sie wollen einen Vorschlag machen. Welcher Satz passt?",
    opts: [
      "Da bin ich anderer Meinung.",
      "Das halte ich für keine gute Idee.",
      "Wir könnten doch die Polizei informieren.",
      "Das sehe ich genauso."
    ],
    ans: 2,
    exp: "<strong>Wir könnten doch…</strong> = Vorschlag machen ✔"
  },
  {
    cat: "Kommunikation: Zustimmen",
    q: "Jemand macht einen Vorschlag. Sie sind einverstanden. Was sagen Sie?",
    opts: [
      "Das sehe ich anders.",
      "Ich bin nicht sicher.",
      "Der Meinung bin ich auch.",
      "Das halte ich für keine gute Idee."
    ],
    ans: 2,
    exp: "<strong>Der Meinung bin ich auch</strong> / Das sehe ich genauso. = zustimmen ✔"
  },
  {
    cat: "Kommunikation: Missverständnis",
    q: "Es gibt ein Missverständnis. Was sagen Sie?",
    opts: [
      "Ich freue mich auf Ihre Rückmeldung.",
      "Das haben Sie falsch verstanden.",
      "Wir könnten das zusammen machen.",
      "Ich schaffe das schon."
    ],
    ans: 1,
    exp: "<strong>Das haben Sie falsch verstanden.</strong> / Das ist ein Missverständnis. ✔"
  }
];

let current = 0, score = 0, answered = false;
const catScores = {};

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

let shuffled = [];

function init() {
  shuffled = shuffle(questions);
  current = 0; score = 0;
  Object.keys(catScores).forEach(k => delete catScores[k]);
  document.getElementById('quiz-card').style.display = '';
  document.getElementById('result').style.display = 'none';
  render();
}

function render() {
  const q = shuffled[current];
  answered = false;

  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-num').textContent = `Frage ${current + 1} von ${shuffled.length}`;
  document.getElementById('q-text').innerHTML = q.q;
  document.getElementById('q-counter').textContent = `Frage ${current+1} von ${shuffled.length}`;
  document.getElementById('progress').style.width = `${(current / shuffled.length) * 100}%`;
  document.getElementById('score-display').textContent = `${score} ✓`;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  const btn = document.getElementById('btn-next');
  btn.className = 'btn-next';

  const opts = document.getElementById('options');
  opts.innerHTML = '';

  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[i]}</span> ${opt}`;
    btn.onclick = () => choose(i, q, btn);
    opts.appendChild(btn);
  });
}

function choose(idx, q, btn) {
  if (answered) return;
  answered = true;

  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  const next = document.getElementById('btn-next');

  if (!catScores[q.cat]) catScores[q.cat] = { right: 0, total: 0 };
  catScores[q.cat].total++;

  if (idx === q.ans) {
    btn.classList.add('correct');
    score++;
    catScores[q.cat].right++;
    fb.innerHTML = `✅ Richtig! ${q.exp}`;
    fb.className = 'feedback ok show';
  } else {
    btn.classList.add('wrong');
    allOpts[q.ans].classList.add('correct');
    fb.innerHTML = `❌ Leider falsch. ${q.exp}`;
    fb.className = 'feedback nope show';
  }

  document.getElementById('score-display').textContent = `${score} ✓`;
  next.className = 'btn-next show';
}

function nextQ() {
  current++;
  if (current >= shuffled.length) { showResult(); return; }
  document.getElementById('quiz-card').style.animation = 'none';
  setTimeout(() => {
    document.getElementById('quiz-card').style.animation = '';
    render();
  }, 50);
}

function showResult() {
  document.getElementById('quiz-card').style.display = 'none';
  const res = document.getElementById('result');
  res.style.display = 'flex';

  const pct = Math.round((score / shuffled.length) * 100);
  let emoji, title;
  if (pct >= 90) { emoji = '🏆'; title = 'Ausgezeichnet!'; }
  else if (pct >= 70) { emoji = '👍'; title = 'Sehr gut!'; }
  else if (pct >= 50) { emoji = '💪'; title = 'Weiter üben!'; }
  else { emoji = '📚'; title = 'Nochmal lernen!'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-score').textContent = `${score} / ${shuffled.length}`;
  document.getElementById('res-sub').textContent = `${pct}% richtig`;

  document.getElementById('progress').style.width = '100%';

  const bd = document.getElementById('breakdown');
  bd.innerHTML = '<h3>Ergebnisse nach Thema</h3>';
  Object.entries(catScores).forEach(([cat, s]) => {
    const item = document.createElement('div');
    item.className = 'breakdown-item';
    item.innerHTML = `<span>${cat}</span><span>${s.right}/${s.total}</span>`;
    bd.appendChild(item);
  });
}

function restart() { init(); }

init();
</script>
</body>
</html>
